title: Philadelphia Flight Control Laboratory
tagline: Faculty of Aerospace Engineering, Technion
description: >-
  The Philadelphia Flight Control Laboratory (PFCL) is the umbrella laboratory for
  Guidance, Navigation, and Control (GNC) research and education in the Faculty of
  Aerospace Engineering at the Technion.
lang: en
email: pfcl@technion.ac.il

url: https://pfcl-technion.github.io
baseurl: ""
permalink: pretty

theme: bulma-clean-theme

fixed_navbar: top
force_theme: light
theme_color: '#eeeeee'
favicon: /assets/images/pfcl_logo_white.png
hide_share_buttons: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed
  source_dir: _sass

collections:
  labs:
    output: false
  team:
    output: false
  projects:
    output: true
    permalink: /projects/:slug/
  news:
    output: false

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      show_sidebar: false
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

project_inquiry_form_url: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - compose.yml
  - .devcontainer
  - scripts
  - test
  - docs
  - references
  - AGENTS.md
  - README.md
  - vendor
  - node_modules
