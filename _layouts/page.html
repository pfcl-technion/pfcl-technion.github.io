<section class="pfcl-hero hero mb-5">

    <h1 class="title is-2">{{ page.title }}</h1>

      <p class="subtitle is-5">{{ page.subtitle }}</p>
    {% endif %}

</section>

<section class="section pt-0">
  <div class="container">
    <div class="content">
      {{ content }}
    </div>
  </div>
</section>
