<!doctype html>
<html lang="en" class="showcase-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} — Showcase</title>
  <link rel="stylesheet" href="{{ '/assets/css/app.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="shortcut icon" type="image/png" href="{{ site.favicon | relative_url }}">
</head>
<body class="showcase-body">
  <header class="showcase-header">
    <div class="showcase-header-left">
      <h1 class="showcase-main-title">Philadelphia Flight Control Laboratory</h1>
      <p class="showcase-sub-title">Stephen B. Klein Faculty of Aerospace Engineering</p>
    </div>
    <div class="showcase-header-center">
      <img src="{{ '/assets/images/PFCL-1_edited.png' | relative_url }}" alt="PFCL Emblem" class="showcase-logo-center">
    </div>
    <div class="showcase-header-right">
      <div id="showcase-clock" class="showcase-clock">--:--:--</div>
      <div id="showcase-date" class="showcase-date">Loading...</div>
    </div>
  </header>

  <main class="showcase-main">
    {{ content }}
  </main>

  <footer class="showcase-footer">
    <div class="showcase-footer-left">
      <span id="showcase-category" class="showcase-category-badge">OVERVIEW</span>
      <span id="showcase-counter" class="showcase-counter">Slide 1 of --</span>
      <span id="showcase-pause-status" class="showcase-pause-badge" style="display:none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: -1px; margin-right: 2px;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> PAUSED</span>
    </div>

    <div class="showcase-footer-center">
      <div class="showcase-qr-box">
        <img src="{{ '/assets/images/showcase_qr.png' | relative_url }}" alt="Website QR Code" class="showcase-qr-img">
        <div class="showcase-qr-caption">
          <span class="showcase-qr-title">Visit Website</span>
          <span class="showcase-qr-url">pfcl.technion.ac.il</span>
        </div>
      </div>
    </div>

    <div class="showcase-footer-right">
      <span class="showcase-key-hint">Press [Space] to Pause</span>
    </div>
  </footer>

  <script src="{{ '/assets/js/showcase.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
