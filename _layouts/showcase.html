<!doctype html>
<html lang="en" class="showcase-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} — Showcase</title>
  <link rel="stylesheet" href="{{ '/assets/css/app.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="shortcut icon" type="image/png" href="{{ site.favicon | relative_url }}">
</head>
<body class="showcase-body">
  <header class="showcase-header">
    <div class="showcase-header-left">
      <img src="{{ '/assets/images/logo_aerospace.png' | relative_url }}" alt="Stephen B. Klein Faculty of Aerospace Engineering" class="showcase-logo-aerospace">
    </div>
    <div class="showcase-header-center">
      <div class="showcase-emblem-badge">
        <img src="{{ '/assets/images/PFCL-1_edited.png' | relative_url }}" alt="PFCL Emblem" class="showcase-logo-center">
      </div>
    </div>
    <div class="showcase-header-right">
      <div id="showcase-clock" class="showcase-clock">--:--:--</div>
      <div id="showcase-date" class="showcase-date">Loading...</div>
    </div>
  </header>

  <main class="showcase-main">
    {{ content }}
  </main>

  <footer class="showcase-footer">
    <div class="showcase-qr-anchor">
      <div class="showcase-qr-lead">
        <span class="showcase-qr-lead-text">Interesting?</span>
      </div>
      <div class="showcase-qr-box">
        <img src="{{ '/assets/images/showcase_qr.png' | relative_url }}" alt="Website QR Code" class="showcase-qr-img">
      </div>
      <div class="showcase-qr-callout">
        <span class="showcase-qr-callout-arrow" aria-hidden="true">&#9650;</span>
        <span class="showcase-qr-callout-text">Point your camera HERE</span>
      </div>
      <span class="showcase-qr-url">pfcl.technion.ac.il</span>
    </div>
  </footer>

  <script src="{{ '/assets/js/showcase.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
